server:
  host: "0.0.0.0"
  port: 8080
  features:
    static-content:
      classpath:
        - context: "/"
          location: "/WEB"
          welcome: "index.html"

langchain4j:
  providers:
    open-ai:
      # Using OpenAI provider to call OCI GenAI model over OpenAI compatible API
      api-key: "${OCI_API_TOKEN}"
      base-url: https://inference.generativeai.us-chicago-1.oci.oraclecloud.com/20231130/actions
      log-requests: false
      log-responses: false

  models:
    cheap-model:
      provider: open-ai
      model-name: "meta.llama-4-scout-17b-16e-instruct"

    expensive-model:
      provider: open-ai
      model-name: "openai.gpt-oss-120b"

  embedding-stores:
    se-embedding-store:
      provider: helidon
    mp-embedding-store:
      provider: helidon

  content-retrievers:
    se-content-retriever:
      provider: helidon
      max-results: 10
      min-score: 0.6
      embedding-model: all-mini-lm-l6v2-embedding-model
      embedding-store: se-embedding-store

    mp-content-retriever:
      provider: helidon
      max-results: 10
      min-score: 0.6
      embedding-model: all-mini-lm-l6v2-embedding-model
      embedding-store: mp-embedding-store

app:
  latest-helidon-version: 4.3.4
  helidon-docs-path: ./helidon-docs
  inclusions: "*.adoc"